services:
  web:
    build:
      context: .
    image: smartkitap:1.0
    container_name: smartkitap-web
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/media /data/private_media &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn smartkitap.wsgi:application --bind 0.0.0.0:8000 --workers 2
    volumes:
      - app_data:/data
      - public_media:/data/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    networks:
      - smartkitap-network
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: smartkitap-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - public_media:/data/media:ro
    depends_on:
      - web
    networks:
      - smartkitap-network
    restart: unless-stopped

volumes:
  app_data:
  static_data:
  public_media:

networks:
  smartkitap-network:
    driver: bridge
