{% load i18n ui %}
{% if is_paginated %}<nav class="pagination-wrap" aria-label="{% trans 'Пагинация каталога' %}">
{% if page_obj.has_previous %}<a class="page-link" href="?{% query_replace page=page_obj.previous_page_number %}">{% trans 'Назад' %}</a>{% endif %}
<span class="page-current">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="page-link" href="?{% query_replace page=page_obj.next_page_number %}">{% trans 'Вперёд' %}</a>{% endif %}
</nav>{% endif %}
